name: Watch scan

on:
  schedule:
    - cron: "17 * * * *"   # hourly; GitHub can run scheduled jobs a bit late
  workflow_dispatch:        # "Run workflow" button on the Actions tab

concurrency:
  group: watch-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # seen.json remembers which listings were already alerted, between runs.
      - uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Scan and alert
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scanner.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
